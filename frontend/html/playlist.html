<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist — openSound</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/home.css">
    <script src="../js/player.js" defer></script>
    <script src="../js/playlist.js" defer></script>
</head>

    <!-- Barra de player fixa no rodapé — compartilhada entre páginas via
         player.js. Fica escondida até existir alguma música tocando ou
         retomada do localStorage. -->
    <div id="player-barra" class="player-barra hidden">
        <img id="player-capa" class="player-capa" alt="Capa da música atual">
        <div class="player-info">
            <p id="player-titulo" class="player-titulo"></p>
            <p id="player-artista" class="player-artista"></p>
        </div>
        <button id="player-play-pause" type="button">▶</button>
        <button id="player-proxima" type="button" class="btn-icone" aria-label="Pular para a próxima" title="Próxima">⏭</button>
        <span id="player-tempo-atual" class="player-tempo">0:00</span>
        <input type="range" id="player-seek" class="player-seek" min="0" max="100" value="0" step="1">
        <span id="player-tempo-total" class="player-tempo">0:00</span>
        <button id="player-favoritar" type="button" class="btn-icone" aria-label="Favoritar">♡</button>
        <button id="player-add-playlist" type="button" class="btn-icone" aria-label="Adicionar à playlist">＋</button>
        <div class="player-volume">
            <button id="player-volume-btn" type="button" class="btn-volume" aria-label="Volume">🔊</button>
            <input type="range" id="player-volume" class="volume-slider" min="0" max="1" step="0.01" value="1" aria-label="Controle de volume">
        </div>
    </div>
    
<body>
    <nav class="fixed-bar">
        <div class="nav-left">
            <a href="biblioteca.html" class="btn-navbar" id="link-voltar">← Voltar</a>
        </div>
        <div class="nav-center">
            <span id="titulo-playlist" class="titulo-navbar-config">Playlist</span>
        </div>
        <div class="nav-right">
            <button class="btn-navbar hidden" id="btn-tocar-playlist">▶ Tocar</button>
            <button class="btn-navbar hidden" id="btn-excluir-playlist">Excluir playlist</button>
        </div>
    </nav>

    <div class="main-ctt-biblioteca">
        <div class="secao-musicas">
            <h2 id="titulo-secao-playlist" class="secao-titulo aba-biblioteca">Playlist</h2>
            <div id="grade-musicas-playlist" class="grade-cards">
                <p class="mensagem-lista">Carregando...</p>
            </div>

            <!-- Busca pra somar mais músicas nesta playlist específica -->
            <section class="busca-playlist" aria-label="Adicionar músicas à playlist">
                <h3 class="busca-playlist-titulo">Adicionar músicas</h3>
                <form id="form-busca-playlist" class="busca-playlist-form" autocomplete="off">
                    <input type="search" id="campo-busca-playlist" class="busca-playlist-input"
                        placeholder="busque por título ou artista..." maxlength="100">
                    <button type="submit" id="btn-busca-playlist" class="btn-navbar">Buscar</button>
                </form>
                <div id="resultados-busca-playlist" class="busca-playlist-resultados hidden"></div>
            </section>
        </div>
    </div>

</body>
</html>

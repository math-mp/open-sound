<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações — openSound</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/home.css">
    <script src="../js/player.js" defer></script>
    <script src="../js/config.js" defer></script>
</head>

    <!-- Barra de player fixa no rodapé — compartilhada entre páginas via
         player.js. Fica escondida até existir alguma música tocando ou
         retomada do localStorage. -->
    <div id="player-barra" class="player-barra hidden">
        <img id="player-capa" class="player-capa" alt="Capa da música atual">
        <div class="player-info">
            <p id="player-titulo" class="player-titulo"></p>
            <p id="player-artista" class="player-artista"></p>
        </div>
        <button id="player-play-pause" type="button">▶</button>
        <button id="player-proxima" type="button" class="btn-icone" aria-label="Pular para a próxima" title="Próxima">⏭</button>
        <span id="player-tempo-atual" class="player-tempo">0:00</span>
        <input type="range" id="player-seek" class="player-seek" min="0" max="100" value="0" step="1">
        <span id="player-tempo-total" class="player-tempo">0:00</span>
        <button id="player-favoritar" type="button" class="btn-icone" aria-label="Favoritar">♡</button>
        <button id="player-add-playlist" type="button" class="btn-icone" aria-label="Adicionar à playlist">＋</button>
        <div class="player-volume">
            <button id="player-volume-btn" type="button" class="btn-volume" aria-label="Volume">🔊</button>
            <input type="range" id="player-volume" class="volume-slider" min="0" max="1" step="0.01" value="1" aria-label="Controle de volume">
        </div>
    </div>

<body>
    <nav class="fixed-bar">
        <div class="nav-left">
            <a href="home.html" class="btn-navbar" id="link-voltar">← Voltar</a>
        </div>
        <div class="nav-center">
            <span class="titulo-navbar-config">Configurações</span>
        </div>
        <div class="nav-right">
            <button class="btn-navbar" id="btn-sair-config">Sair</button>
        </div>
    </nav>

    <div class="main-ctt-config">

        <!-- Seção: Redefinir senha -->
        <div class="secao-config">
            <h2>Redefinir senha</h2>

            <!-- Etapa 1: pedir a nova senha e disparar o código -->
            <div id="etapa-senha-1" class="etapa">
                <form id="form-senha-etapa1">
                    <input type="password" id="nova-senha" placeholder="Nova senha" required>
                    <button type="submit" id="btn-solicitar-codigo">Enviar código de verificação</button>
                </form>
                <!-- Fica visível e com o texto do cooldown só quando o
                     botão acima está desabilitado (24h desde o último reset). -->
                <p id="mensagem-cooldown" class="mensagem-cooldown hidden"></p>
            </div>

            <!-- Etapa 2: confirmar o código recebido por e-mail -->
            <div id="etapa-senha-2" class="etapa hidden">
                <p>Digite o código de 6 dígitos enviado para o seu e-mail:</p>
                <input type="text" id="codigo-redefinicao" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="Código de 6 dígitos">
                <button id="btn-confirmar-redefinicao">Confirmar e trocar senha</button>
            </div>
        </div>

        <!-- Seção: Deletar conta -->
        <div class="secao-config secao-perigo">
            <h2>Deletar conta</h2>
            <p>Isso apaga sua conta e <strong>todas as músicas que você enviou</strong>, permanentemente. Não tem como desfazer.</p>
            <p>Para confirmar, digite exatamente: <strong id="texto-frase-esperada">eu desejo deletar ...</strong></p>
            <input type="text" id="frase-confirmacao" placeholder="Digite a frase de confirmação">
            <button id="btn-deletar-conta" class="btn-perigo">Deletar conta permanentemente</button>
        </div>

    </div>

</body>
</html>

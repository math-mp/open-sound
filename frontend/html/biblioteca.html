<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca — openSound</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/modal-playlist.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <script>
        // Só o que precisa existir antes do primeiro paint: se há sessão
        // e qual é o tema. O sessao.js entra com defer porque estas páginas
        // não têm avatar/nome para pintar (a home e o perfil cuidam disso).
        (function () {
            document.documentElement.dataset.sessao =
                localStorage.getItem('tokenSessao') ? 'logado' : 'visitante';
            if (localStorage.getItem('opensound_tema') === 'light') {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <script src="../js/sessao.js" defer></script>
    <script src="../js/player.js" defer></script>
    <script src="../js/favoritos.js" defer></script>
    <script src="../js/biblioteca.js" defer></script>
</head>

    <!-- Barra de player fixa no rodapé — compartilhada entre páginas via
         player.js. Fica escondida até existir alguma música tocando ou
         retomada do localStorage. -->
    <div id="player-barra" class="player-barra hidden">
        <img id="player-capa" class="player-capa" alt="Capa da música atual">
        <div class="player-info">
            <p id="player-titulo" class="player-titulo"></p>
            <p id="player-artista" class="player-artista"></p>
        </div>
        <button id="player-play-pause" type="button">▶</button>
        <button id="player-proxima" type="button" class="btn-icone" aria-label="Pular para a próxima" title="Próxima">⏭</button>
        <span id="player-tempo-atual" class="player-tempo">0:00</span>
        <input type="range" id="player-seek" class="player-seek" min="0" max="100" value="0" step="1">
        <span id="player-tempo-total" class="player-tempo">0:00</span>
        <button id="player-favoritar" type="button" class="btn-icone" aria-label="Favoritar">♡</button>
        <button id="player-add-playlist" type="button" class="btn-icone" aria-label="Adicionar à playlist">＋</button>
        <div class="player-volume">
            <button id="player-volume-btn" type="button" class="btn-volume" aria-label="Volume">🔊</button>
            <input type="range" id="player-volume" class="volume-slider" min="0" max="1" step="0.01" value="1" aria-label="Controle de volume">
        </div>
    </div>
    
<body>
    <nav class="fixed-bar">
        <div class="nav-left">
            <a href="home.html" class="btn-navbar" id="link-voltar">← Voltar</a>
        </div>
        <div class="nav-center">
            <span class="titulo-navbar-config">Minha Biblioteca</span>
        </div>
        <div class="nav-right"></div>
    </nav>

    <div class="main-ctt-biblioteca">
        <div class="secao-musicas">
            <h2 class="secao-titulo aba-playlists">Minhas Playlists</h2>
            <div id="grade-playlists" class="grade-cards">
                <p class="mensagem-lista">Carregando...</p>
            </div>
        </div>
    </div>

    <!-- Modal/Popup de Nova Playlist -->
    <div id="modal-nova-playlist" class="modal modal--aba hidden">
    <div class="modal-quadro">
        <span class="modal-aba-titulo" aria-hidden="true">Nova Playlist</span>
    <div class="conteudo-modal">
        <button id="btn-fechar-nova-playlist" class="btn-fechar" aria-label="Fechar">×</button>

        <div class="etapa">
        <h2>Nova Playlist</h2>
        <form id="form-nova-playlist">
            <div class="campo-upload">
                <label for="playlist-nome">Nome da playlist</label>
                <input type="text" id="playlist-nome" placeholder="Ex.: Favoritas de sexta" maxlength="255" required>
            </div>

            <!-- Mesmo cartão de escolha de arquivo do modal de upload: o
                 input fica por cima, invisível, para o clique abrir o
                 seletor e a validação continuar funcionando. -->
            <div class="btn-upload">
                <span class="btn-upload-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                        <circle cx="9" cy="10" r="2"></circle>
                        <path d="m4 18 5-5 4 4 3-3 4 4"></path>
                    </svg>
                </span>
                <span class="btn-upload-texto">
                    <strong>Capa da playlist</strong>
                    <small id="playlist-capa-nome">Opcional · JPG, PNG ou WEBP</small>
                </span>
                <input type="file" id="playlist-capa" accept="image/jpeg,image/png,image/webp" aria-label="Capa da playlist">
            </div>

            <button type="submit" class="btn-modal-acao">Criar playlist</button>
        </form>
        </div>
    </div>
    </div>
    </div>

</body>
</html>

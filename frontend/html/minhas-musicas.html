<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Músicas — openSound</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/modal-playlist.css">
    <link rel="stylesheet" href="../css/minhas-musicas.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <script>
        // Só o que precisa existir antes do primeiro paint: se há sessão
        // e qual é o tema. O sessao.js entra com defer porque estas páginas
        // não têm avatar/nome para pintar (a home e o perfil cuidam disso).
        (function () {
            document.documentElement.dataset.sessao =
                localStorage.getItem('tokenSessao') ? 'logado' : 'visitante';
            if (localStorage.getItem('opensound_tema') === 'light') {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <script src="../js/sessao.js" defer></script>
    <script src="../js/player.js" defer></script>
    <script src="../js/favoritos.js" defer></script>
    <script src="../js/minhas-musicas.js" defer></script>
</head>


<body>
    <nav class="fixed-bar">
        <div class="nav-left">
            <a href="home.html" class="btn-navbar" id="link-voltar">← Voltar</a>
        </div>
        <div class="nav-center">
            <span class="titulo-navbar-config">Minhas Músicas</span>
        </div>
        <div class="nav-right"></div>
    </nav>

    <div class="main-ctt-biblioteca">

        <!-- Painel em estilo "aba/pasta" pastel, igual ao da Home.
             O #lista-minhas-musicas continua sendo a lista de cards — agora
             ela é a trilha rolável do carrossel. -->
        <div class="secao-musicas">
            <h2 class="secao-titulo aba-biblioteca">Minhas Músicas</h2>

            <div class="carrossel-controle">
                <button type="button" class="msc-seta" id="bib-seta-esq" aria-label="Músicas anteriores">←</button>

                <div id="lista-minhas-musicas" class="lista-minhas-musicas-carrossel">
                    <p class="mensagem-lista">Carregando suas músicas...</p>
                </div>

                <button type="button" class="msc-seta" id="bib-seta-dir" aria-label="Próximas músicas">→</button>
            </div>

            <div class="carrossel-indicadores" id="bib-indicadores" hidden></div>
        </div>

    </div>

    <!-- Player fixo no rodapé. Mesma estrutura/IDs usados na Home
         (home.js), pra que o botão "Tocar" dos cards use exatamente
         o mesmo componente de áudio. Fica escondida até existir alguma
         música tocando ou retomada do localStorage. -->
    <div class="player-barra hidden" id="player-barra">
        <img class="player-capa" id="player-capa" src="" alt="Capa da música tocando">
        <div class="player-info">
            <span class="player-titulo" id="player-titulo">Nada tocando</span>
            <span class="player-artista" id="player-artista">—</span>
        </div>
        <button type="button" id="player-play-pause" aria-label="Tocar ou pausar">▶</button>
        <button type="button" class="btn-icone" id="player-proxima" aria-label="Pular para a próxima" title="Próxima">⏭</button>
        <span class="player-tempo" id="player-tempo-atual">0:00</span>
        <input class="player-seek" id="player-seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Posição da música">
        <span class="player-tempo" id="player-tempo-total">0:00</span>
        <button type="button" id="player-favoritar" class="btn-icone" aria-label="Favoritar">♡</button>
        <button type="button" id="player-add-playlist" class="btn-icone" aria-label="Adicionar à playlist">＋</button>
        <div class="player-volume">
            <button type="button" class="btn-volume" id="player-volume-btn" aria-label="Volume">🔊</button>
            <input class="volume-slider" id="player-volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        </div>
    </div>

</body>
</html>
